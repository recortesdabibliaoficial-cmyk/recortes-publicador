name: Publicar no Instagram

on:
  schedule:
    - cron: '*/15 * * * *'      # a cada 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:             # botão "Run workflow" para rodar na hora
    inputs:
      forcar:
        description: 'sim = ler as métricas agora (botão Atualizar do painel; no máximo 1 vez a cada 30 min)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publicar o que chegou na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCAR_METRICAS: ${{ github.event.inputs.forcar || '' }}
        run: python publicar.py
      - name: Guardar o que foi publicado
        if: always()
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add estado.json; git add metricas.json comentarios.json historico.json 2>/dev/null || true
          git add curvas.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "estado: publicações"
          # se outra gravação chegou antes, traz a versão nova e tenta de novo (evita perder o registro do que foi publicado)
          mkdir -p /tmp/nossa; cp estado.json metricas.json comentarios.json historico.json curvas.json /tmp/nossa/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            # conflito: em vez de desistir, pega a versão do GitHub e junta os nossos dados com os dela (juntar_dados.py)
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python juntar_dados.py /tmp/nossa
            git add estado.json; git add metricas.json comentarios.json historico.json curvas.json 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "estado: publicações (dados juntados)"
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "ERRO: não consegui salvar o estado depois de 5 tentativas"; exit 1
