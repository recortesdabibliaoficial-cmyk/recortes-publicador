name: Publicar no Instagram

on:
  schedule:
    - cron: '*/15 * * * *'      # a cada 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publicar o que chegou na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python publicar.py
      - name: Guardar o que foi publicado
        if: always()
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add estado.json metricas.json 2>/dev/null || git add estado.json
          git diff --cached --quiet || (git commit -m "estado: publicações" && git push)
