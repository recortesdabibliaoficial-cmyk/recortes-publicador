name: Relatórios por e-mail

on:
  schedule:
    - cron: '50 2 * * *'        # 23h50 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:             # botão "Run workflow" para mandar na hora
    inputs:
      dia:
        description: 'Dia do relatório (AAAA-MM-DD). Vazio = hoje'
        required: false
      tipo:
        description: 'diario, semanal, mensal ou anual. Vazio = os do dia'
        required: false

permissions:
  contents: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Montar e enviar
        env:
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          DIA: ${{ inputs.dia }}
          TIPO: ${{ inputs.tipo }}
        run: python relatorio.py ${DIA:+--dia "$DIA"} ${TIPO:+--tipo "$TIPO"}
