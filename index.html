<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda dos canais</title>
<style>
  :root { --bg:#f6efe4; --card:#fffaf2; --tinta:#3a2418; --suave:#7a6a5c; --linha:#e6d9c6; --terra:#b8604a;
          --ok:#2f7d4f; --okbg:#e3f2e8; --agenda:#8a5a1f; --agbg:#fbefd9; --err:#b3261e; --errbg:#fbe4e1; --mc:#5a5aa0; --mcbg:#ecebf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1814; --card:#28211b; --tinta:#f1e6d6; --suave:#b9a894; --linha:#3d332a; --terra:#e08a70;
            --ok:#7fd3a0; --okbg:#1f3a2a; --agenda:#f0c27a; --agbg:#3a2f1c; --err:#ff9b91; --errbg:#4a2320; --mc:#b7b5f0; --mcbg:#2c2b48; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tinta); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; max-width:880px; margin:auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--suave); font-size:13px; }
  .resumo { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .pill { font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .ok { background:var(--okbg); color:var(--ok); } .ag { background:var(--agbg); color:var(--agenda); }
  .err { background:var(--errbg); color:var(--err); } .mc { background:var(--mcbg); color:var(--mc); }
  .filtros { display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap; }
  .filtros button { border:1px solid var(--linha); background:var(--card); color:var(--tinta); border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; }
  .filtros button.ativo { background:var(--terra); border-color:var(--terra); color:#fff; }
  main { max-width:880px; margin:auto; padding:0 16px 40px; }
  .dia { margin-top:22px; }
  .dia h2 { font-size:15px; margin:0 0 8px; color:var(--terra); text-transform:capitalize; }
  .dia.hoje h2::after { content:" · hoje"; color:var(--tinta); }
  .item { display:flex; gap:12px; background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:10px; margin-bottom:8px; }
  .item img { width:64px; height:80px; object-fit:cover; border-radius:6px; flex:none; background:var(--linha); }
  .item.story img, .item.reel img { height:96px; width:54px; }
  .meio { flex:1; min-width:0; }
  .linha1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hora { font-weight:700; font-variant-numeric:tabular-nums; }
  .tipo { font-size:12px; color:var(--suave); }
  .titulo { font-weight:600; margin-top:2px; }
  details { margin-top:4px; } summary { cursor:pointer; color:var(--suave); font-size:13px; }
  pre { white-space:pre-wrap; font:13px/1.45 inherit; font-family:inherit; margin:6px 0 0; color:var(--tinta); }
  .erro { color:var(--err); font-size:13px; margin-top:4px; word-break:break-word; }
  .abas { display:flex; gap:4px; margin:0 0 14px; border-bottom:1px solid var(--linha); }
  .abas button { border:0; background:none; color:var(--suave); font:600 15px system-ui, sans-serif; padding:8px 12px; cursor:pointer; border-bottom:3px solid transparent; }
  .abas button.ativo { color:var(--tinta); border-color:var(--terra); }
  .link { font-size:13px; color:var(--terra); text-decoration:none; margin-left:2px; }
  #tarefas { max-width:880px; margin:16px auto 0; padding:0 16px; }
  .caixa { background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:12px 14px; }
  .caixa h2 { font-size:16px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .caixa h2 button { border:0; background:none; color:var(--suave); font-size:12px; cursor:pointer; }
  .tarefa { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--linha); font-size:14px; }
  .tarefa:first-of-type { border-top:0; }
  .tarefa input { width:20px; height:20px; margin-top:1px; flex:none; accent-color:var(--terra); }
  .tarefa.feita span { text-decoration:line-through; color:var(--suave); }
  .tarefa small { display:block; color:var(--suave); font-size:12px; margin-top:2px; }
  .nada { color:var(--suave); font-size:14px; }
  .abas .n { background:var(--terra); color:#fff; border-radius:99px; font-size:11px; padding:1px 6px; margin-left:4px; }
  footer { max-width:880px; margin:auto; padding:0 16px 30px; color:var(--suave); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="abas" id="abas"></div>
  <h1>Agenda de publicações</h1>
  <div class="sub"><span id="handle"></span> · atualiza sozinha depois de cada publicação · <span id="atual"></span></div>
  <div class="resumo" id="resumo"></div>
  <div class="filtros" id="filtros">
    <button data-f="todos" class="ativo">Tudo</button>
    <button data-f="futuro">Próximos</button>
    <button data-f="CARROSSEL">Carrosséis</button>
    <button data-f="REEL">Reels</button>
    <button data-f="STORY">Stories</button>
  </div>
</header>
<section id="tarefas"></section>
<main id="lista">Carregando…</main>
<footer>Selos: <b>Publicado</b> (já saiu pelo publicador) · <b>Agendado</b> (vai sair no horário) · <b>Metricool</b> (agendado lá, antes da troca para a API; vira Publicado quando o publicador confere no Instagram) · <b>Erro</b> (o Claude precisa ver).</footer>
<script>
const TIPOS = { CARROSSEL:'Carrossel', REEL:'Reel', STORY:'Story' };
const CANAIS = [
  { id:'biblia', nome:'Recortes da Bíblia', handle:'@recortesdabiblia.oficial', base:'/recortes-publicador/' },
  { id:'curiosidades', nome:'Curiosidades em Papel', handle:'@curiosidadesempapel', base:'/curiosidades-publicador/' },
];
let itens = [], filtro = 'todos', manuais = [], verFeitas = false;
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v ? localStorage.setItem(k,'1') : localStorage.removeItem(k); } catch(e){} } };
let canal = CANAIS.find(c => '#'+c.id === location.hash) || CANAIS.find(c => location.pathname.startsWith(c.base)) || CANAIS[0];
function fmtDia(d){ return d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit', timeZone:'America/Sao_Paulo'}); }
function fmtHora(d){ return d.toLocaleTimeString('pt-BR',{hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'}); }
function chaveDia(d){ return d.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}); }
function status(i, est, agora){
  const e = est[i.id] || {};
  if (e.status === 'publicado') return ['Publicado','ok'];
  if (i.via === 'metricool') return new Date(i.quando) < agora - 3*3600e3 ? ['Não confirmado','err'] : ['Metricool','mc'];
  if (e.ultimo_erro) return ['Erro','err'];
  if (new Date(i.quando) < agora - 12*3600e3) return ['Não publicado','err'];
  return ['Agendado','ag'];
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function desenhar(){
  const agora = new Date(), hoje = chaveDia(agora);
  const lista = itens.filter(i => filtro==='todos' || (filtro==='futuro' ? new Date(i.quando) >= agora - 3600e3 : i.tipo===filtro));
  const dias = {};
  lista.forEach(i => { (dias[chaveDia(new Date(i.quando))] ||= []).push(i); });
  const el = document.getElementById('lista');
  el.innerHTML = Object.keys(dias).sort().map(k => {
    const d = new Date(dias[k][0].quando);
    return `<section class="dia ${k===hoje?'hoje':''}"><h2>${fmtDia(d)}</h2>` + dias[k].map(i => {
      const [rot, cls] = i._st, q = new Date(i.quando);
      return `<div class="item ${i.tipo.toLowerCase()}">
        <img loading="lazy" src="${canal.base}${i.miniatura}" alt="">
        <div class="meio">
          <div class="linha1"><span class="hora">${fmtHora(q)}</span><span class="tipo">${TIPOS[i.tipo]||i.tipo}</span><span class="pill ${cls}">${rot}</span>${i._link ? `<a class="link" href="${i._link}" target="_blank" rel="noopener">ver no Instagram ↗</a>` : ''}</div>
          <div class="titulo">${esc(i.titulo||'')}</div>
          ${i._erro ? `<div class="erro">${esc(i._erro)}</div>` : ''}
          ${i.legenda ? `<details><summary>Ver legenda</summary><pre>${esc(i.legenda)}</pre></details>` : ''}
        </div></div>`;
    }).join('') + '</section>';
  }).join('') || '<p>Nada para mostrar neste filtro.</p>';
}
function tarefas(){
  // Tarefas que só o Felipe pode fazer no app: aparecem quando o Story já foi publicado.
  const lista = manuais.map(m => ({ id:'m-'+m.id, txt:m.texto, det:m.detalhe||'' }));
  const vistos = {};
  itens.filter(i => i.destaque && i._st[1]==='ok').forEach(i => {
    const q = new Date(i.quando), quando = q.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'}) + ' ' + fmtHora(q);
    const velho = Date.now() - q > 24*3600e3 ? ' Como já passou de 24 h, ele está em Perfil → ☰ → Arquivo → Stories.' : '';
    const nome = i.titulo || 'Story';
    if (!vistos[i.destaque]) {
      vistos[i.destaque] = 1;
      lista.push({ id:'d-'+i.id, txt:`Criar o destaque «${i.destaque}» com o Story «${nome}» (${quando})`,
        det:`Perfil → Novo (+) → escolha esse Story → Editar capa → capa «destaque - ${i.destaque}» (pasta de destaques no Drive) → nome ${i.destaque}.` + velho });
    } else {
      lista.push({ id:'d-'+i.id, txt:`Adicionar o Story «${nome}» (${quando}) ao destaque «${i.destaque}»`,
        det:'Abra o Story no perfil → Destacar (coração embaixo) → ' + i.destaque + '.' + velho });
    }
  });
  return lista;
}
function desenharTarefas(){
  const ts = tarefas(), chave = id => 'feito:' + canal.id + ':' + id;
  const pend = ts.filter(t => !LS.get(chave(t.id)));
  const mostrar = verFeitas ? ts : pend;
  document.getElementById('tarefas').innerHTML = `<div class="caixa"><h2><span>✅ Para você fazer (${pend.length})</span>` +
    (ts.length > pend.length ? `<button id="verFeitas">${verFeitas ? 'esconder feitas' : 'ver feitas'}</button>` : '') + '</h2>' +
    (mostrar.length ? mostrar.map(t => `<label class="tarefa ${LS.get(chave(t.id))?'feita':''}"><input type="checkbox" data-t="${t.id}" ${LS.get(chave(t.id))?'checked':''}><span>${esc(t.txt)}<small>${esc(t.det)}</small></span></label>`).join('')
      : '<div class="nada">Nada pendente agora. Novas tarefas aparecem aqui quando os Stories forem publicados.</div>') + '</div>';
  const b = document.querySelector('.abas button.ativo'); if (b) b.innerHTML = canal.nome + (pend.length ? `<span class="n">${pend.length}</span>` : '');
}
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.t) { LS.set('feito:' + canal.id + ':' + e.target.dataset.t, e.target.checked); desenharTarefas(); }
});
document.addEventListener('click', e => { if (e.target.id === 'verFeitas') { verFeitas = !verFeitas; desenharTarefas(); } });
async function carregar(){
  const nc = '?t=' + Date.now();
  document.getElementById('handle').textContent = canal.handle;
  document.getElementById('abas').innerHTML = CANAIS.map(c => `<button data-c="${c.id}" class="${c===canal?'ativo':''}">${c.nome}</button>`).join('');
  document.getElementById('lista').textContent = 'Carregando…';
  const [ag, est, man] = await Promise.all([fetch(canal.base+'agenda.json'+nc).then(r=>r.json()).catch(()=>[]), fetch(canal.base+'estado.json'+nc).then(r=>r.json()).catch(()=>({})),
    fetch(canal.base+'tarefas.json'+nc).then(r=>r.json()).catch(()=>[])]);
  manuais = man;
  const agora = new Date();
  itens = ag.sort((a,b)=>a.quando.localeCompare(b.quando)).map(i => ({...i, _st: status(i, est, agora), _erro: (est[i.id]||{}).ultimo_erro, _link: (est[i.id]||{}).link}));
  const c = k => itens.filter(i => i._st[1]===k).length;
  document.getElementById('resumo').innerHTML =
    `<span class="pill ok">${c('ok')} publicados</span><span class="pill ag">${c('ag')} agendados</span>` + (c('mc') ? `<span class="pill mc">${c('mc')} no Metricool</span>` : '') +
    (c('err') ? `<span class="pill err">${c('err')} com erro</span>` : '');
  const fim = itens.length ? new Date(itens[itens.length-1].quando) : null;
  document.getElementById('atual').textContent = fim ? 'agenda até ' + fim.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}) : 'ainda sem posts agendados';
  desenhar(); desenharTarefas();
}
document.getElementById('filtros').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filtro = b.dataset.f; document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('ativo', x===b)); desenhar();
});
document.getElementById('abas').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  canal = CANAIS.find(c => c.id === b.dataset.c); history.replaceState(null, '', '#' + canal.id); carregar();
});
carregar();
</script>
</body>
</html>
