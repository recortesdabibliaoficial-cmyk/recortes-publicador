<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda dos canais</title>
<style>
  :root { --bg:#f6efe4; --card:#fffaf2; --tinta:#3a2418; --suave:#7a6a5c; --linha:#e6d9c6; --terra:#b8604a;
          --ok:#2f7d4f; --okbg:#e3f2e8; --agenda:#8a5a1f; --agbg:#fbefd9; --err:#b3261e; --errbg:#fbe4e1; --mc:#5a5aa0; --mcbg:#ecebf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1814; --card:#28211b; --tinta:#f1e6d6; --suave:#b9a894; --linha:#3d332a; --terra:#e08a70;
            --ok:#7fd3a0; --okbg:#1f3a2a; --agenda:#f0c27a; --agbg:#3a2f1c; --err:#ff9b91; --errbg:#4a2320; --mc:#b7b5f0; --mcbg:#2c2b48; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tinta); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; max-width:880px; margin:auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--suave); font-size:13px; }
  .resumo { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .pill { font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .ok { background:var(--okbg); color:var(--ok); } .ag { background:var(--agbg); color:var(--agenda); }
  .err { background:var(--errbg); color:var(--err); } .mc { background:var(--mcbg); color:var(--mc); }
  .filtros { display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap; }
  .filtros button { border:1px solid var(--linha); background:var(--card); color:var(--tinta); border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; }
  .filtros button.ativo { background:var(--terra); border-color:var(--terra); color:#fff; }
  main { max-width:880px; margin:auto; padding:0 16px 40px; }
  .dia { margin-top:22px; }
  .dia h2 { font-size:15px; margin:0 0 8px; color:var(--terra); text-transform:capitalize; }
  .dia.hoje h2::after { content:" · hoje"; color:var(--tinta); }
  .dia > summary { list-style:none; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; color:var(--tinta); font-size:15px; margin-bottom:8px; }
  .dia > summary::-webkit-details-marker { display:none; }
  .dia > summary h2 { margin:0; }
  .dia > summary h2::before { content:"▸ "; color:var(--suave); }
  .dia[open] > summary h2::before { content:"▾ "; }
  .dia:not([open]) { margin-top:10px; }
  .rd { font-size:12.5px; color:var(--suave); }
  .filtros .n2 { font-weight:400; opacity:.75; margin-left:2px; }
  .filtros.tipos { margin-top:6px; } .filtros.tipos button { font-size:12px; padding:3px 10px; }
  .proximo { margin-top:18px; display:flex; flex-direction:column; gap:2px; background:var(--agbg); color:var(--agenda); border-radius:12px; padding:10px 14px; }
  .proximo b { color:var(--tinta); font-size:15px; }
  .mais { display:block; margin:16px auto 0; border:1px solid var(--linha); background:var(--card); color:var(--tinta); border-radius:99px; padding:7px 16px; font-size:13px; cursor:pointer; }
  .item { display:flex; gap:12px; background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:10px; margin-bottom:8px; }
  .item img { width:64px; height:80px; object-fit:cover; border-radius:6px; flex:none; background:var(--linha); }
  .item.story img, .item.reel img { height:96px; width:54px; }
  .meio { flex:1; min-width:0; }
  .linha1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hora { font-weight:700; font-variant-numeric:tabular-nums; }
  .tipo { font-size:12px; color:var(--suave); }
  .titulo { font-weight:600; margin-top:2px; }
  details { margin-top:4px; } summary { cursor:pointer; color:var(--suave); font-size:13px; }
  pre { white-space:pre-wrap; font:13px/1.45 inherit; font-family:inherit; margin:6px 0 0; color:var(--tinta); }
  .erro { color:var(--err); font-size:13px; margin-top:4px; word-break:break-word; }
  .abas { display:flex; gap:4px; margin:0 0 14px; border-bottom:1px solid var(--linha); }
  .abas button { border:0; background:none; color:var(--suave); font:600 15px system-ui, sans-serif; padding:8px 12px; cursor:pointer; border-bottom:3px solid transparent; }
  .abas button.ativo { color:var(--tinta); border-color:var(--terra); }
  .link { font-size:13px; color:var(--terra); text-decoration:none; margin-left:2px; }
  #tarefas { max-width:880px; margin:16px auto 0; padding:0 16px; }
  .caixa { background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:12px 14px; }
  .caixa h2 { font-size:16px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .caixa h2 button { border:0; background:none; color:var(--suave); font-size:12px; cursor:pointer; }
  .tarefa { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--linha); font-size:14px; }
  .tarefa:first-of-type { border-top:0; }
  .tarefa input { width:20px; height:20px; margin-top:1px; flex:none; accent-color:var(--terra); }
  .tarefa.feita span { text-decoration:line-through; color:var(--suave); }
  .tarefa small { display:block; color:var(--suave); font-size:12px; margin-top:2px; }
  .nada { color:var(--suave); font-size:14px; }
  .pin { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--linha); font-size:13px; }
  .pin input { width:120px; padding:6px 8px; border:1px solid var(--linha); border-radius:8px; background:var(--bg); color:var(--tinta); }
  .pin button { padding:6px 12px; border:0; border-radius:8px; background:var(--terra); color:#fff; cursor:pointer; }
  .pin small { width:100%; color:var(--err); }
  .pronto { display:block; margin:6px 0; padding:8px 10px; background:var(--bg); border-radius:8px; color:var(--tinta); font-size:13.5px; user-select:all; }
  .copiar { padding:5px 10px; border:1px solid var(--linha); border-radius:8px; background:var(--card); color:var(--tinta); cursor:pointer; font-size:12.5px; margin-right:8px; }
  .abas .n { background:var(--terra); color:#fff; border-radius:99px; font-size:11px; padding:1px 6px; margin-left:4px; }
  #painel { max-width:880px; margin:16px auto 0; padding:0 16px; }
  .nums { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:6px; }
  .num { background:var(--bg); border-radius:10px; padding:8px 10px; }
  .num b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .num span { font-size:12px; color:var(--suave); }
  .met { font-size:12.5px; color:var(--suave); margin-top:4px; font-variant-numeric:tabular-nums; }
  .top { font-size:13px; margin-top:8px; }
  footer { max-width:880px; margin:auto; padding:0 16px 30px; color:var(--suave); font-size:12px; }
  .item img { cursor:zoom-in; }
  #ver { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; flex-direction:column; z-index:50; }
  #ver.aberto { display:flex; }
  #ver .topo { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; color:#fff; font-size:14px; }
  #ver .topo button { border:0; background:rgba(255,255,255,.15); color:#fff; font-size:22px; width:40px; height:40px; border-radius:99px; cursor:pointer; }
  #ver .fita { flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; min-height:0; }
  #ver .fita > * { flex:0 0 100%; width:100%; height:100%; object-fit:contain; scroll-snap-align:center; }
  #ver .dica { color:#bbb; text-align:center; font-size:12px; padding:6px 16px 14px; }
  /* ----- Painel de métricas ----- */
  body.modo-painel .so-agenda { display:none !important; }
  #modo { margin-top:-4px; }
  #dash { max-width:880px; margin:0 auto; padding:0 16px 40px; }
  #dash[hidden] { display:none; }
  #dash .caixa { margin-bottom:12px; }
  #dash .sec h2 { margin-bottom:2px; }
  #dash h3 { font-size:13px; margin:12px 0 4px; color:var(--terra); }
  .tg { cursor:pointer; user-select:none; }
  .tg .tgb { font-size:14px; padding:2px 6px; }
  .caixa.fechada .corpo { display:none; }
  .abrfec { font-size:12.5px; margin-top:6px; } .abrfec a { color:var(--terra); cursor:pointer; text-decoration:underline; margin-right:10px; }
  .obs p { margin:6px 0; font-size:14px; } .obs ul { margin:6px 0; padding-left:20px; font-size:14px; } .obs h4 { margin:10px 0 2px; font-size:14px; color:var(--terra); }
  .obs .quando { font-size:12px; color:var(--suave); }
  .obs details { margin-top:10px; } .obs summary { cursor:pointer; font-size:13px; color:var(--suave); } .obs details .ant { border-top:1px solid var(--linha); margin-top:8px; padding-top:6px; }
  .expl { color:var(--suave); font-size:12.5px; margin:0 0 8px; }
  .suave { color:var(--suave); font-size:12px; }
  .num .x { display:block; font-size:11px; opacity:.85; }
  .grafico { position:relative; height:230px; width:100%; }
  .rolagem { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tb { border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .tb th { text-align:right; color:var(--suave); font-weight:600; padding:5px 6px; border-bottom:1px solid var(--linha); white-space:nowrap; }
  .tb td { text-align:right; padding:5px 6px; border-bottom:1px solid var(--linha); }
  .tb th:first-child, .tb td.r { text-align:left; }
  .tb td.r { min-width:120px; }
  .tb td.melhor { background:var(--okbg); color:var(--ok); font-weight:700; border-radius:4px; }
  .tb td.pior { background:var(--errbg); color:var(--err); font-weight:700; border-radius:4px; }
  .tb.base td.tx, .tb.base th { white-space:nowrap; } .tb.base td.r { min-width:180px; }
  .tb.base td.gch { min-width:220px; white-space:normal; font-size:12px; }
  .tb th.ord { cursor:pointer; user-select:none; } .tb th.ord.on { color:var(--terra); }
  .rolagem.base { max-height:520px; overflow:auto; } .rolagem.base thead th { position:sticky; top:0; background:var(--card); z-index:1; }
  .buscab { display:flex; gap:8px; margin:10px 0 6px; flex-wrap:wrap; }
  .buscab input { flex:1; min-width:160px; padding:6px 10px; border:1px solid var(--linha); border-radius:8px; background:var(--card); color:var(--tinta); font-size:14px; }
  .buscab button { border:1px solid var(--linha); background:var(--card); color:var(--tinta); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .tb.rec td.r { min-width:170px; } .tb.rec td.r .suave { display:block; }
  .d { font-weight:600; color:var(--suave); } .d.bom { color:var(--ok); } .d.ruim { color:var(--err); }
  .alerta { font-size:13.5px; padding:7px 10px; border-radius:8px; margin-top:6px; background:var(--agbg); color:var(--agenda); }
  .alerta.err { background:var(--errbg); color:var(--err); } .alerta.okk { background:var(--okbg); color:var(--ok); }
  .funil { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; margin:6px 0 10px; }
  .funil .etapa { background:var(--bg); border-radius:10px; padding:8px 12px; text-align:center; min-width:110px; }
  .funil .etapa b { display:block; font-size:20px; } .funil .etapa span { font-size:12px; color:var(--suave); }
  .funil .seta { text-align:center; font-weight:700; color:var(--terra); font-size:14px; } .funil .seta small { display:block; font-size:11px; color:var(--suave); font-weight:400; }
  #dash .filtros { margin:0 0 6px; }
  .atu { margin:6px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .atu button { border:0; border-radius:99px; background:var(--terra); color:#fff; font:600 13px system-ui, sans-serif; padding:7px 14px; cursor:pointer; }
  .atu button:disabled { opacity:.6; }
  .barra { display:inline-block; vertical-align:middle; width:140px; height:8px; border-radius:99px; background:var(--linha); overflow:hidden; }
  .barra > span { display:block; height:100%; width:0; background:var(--terra); transition:width .6s; }
  /* Stories: quem já segue (tabela por dia; tocar no dia abre os Stories dele) */
  .tb.st th { white-space:normal; vertical-align:bottom; line-height:1.2; }
  .tb.st tr.tem { cursor:pointer; }
  .tb.st tr.tem:hover td { background:var(--bg); }
  .tb.st .stbtn { border:0; background:none; color:inherit; font:inherit; padding:0; cursor:pointer; text-align:left; }
  .tb.st .stseta { color:var(--terra); display:inline-block; width:1em; }
  .tb.st .stdet[hidden] { display:none; }
  .tb.st .stdet > td { text-align:left; background:var(--bg); padding:6px 8px 10px; }
  .tb.st .stdet .tb { font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="abas" id="abas"></div>
  <div class="abas" id="modo"><button data-m="agenda" class="ativo">Agenda</button><button data-m="painel">Painel</button></div>
  <h1 class="so-agenda">Agenda de publicações</h1>
  <div class="sub so-agenda"><span id="handle"></span> · atualiza sozinha depois de cada publicação · <span id="atual"></span></div>
  <div class="resumo so-agenda" id="resumo"></div>
  <div class="filtros so-agenda" id="fquando">
    <button data-q="prox" class="ativo">Próximos <span class="n2"></span></button>
    <button data-q="hoje">Hoje <span class="n2"></span></button>
    <button data-q="hist">Já saíram <span class="n2"></span></button>
  </div>
  <div class="filtros tipos so-agenda" id="ftipo">
    <button data-tp="todos" class="ativo">Todos os tipos</button>
    <button data-tp="REEL">Reels</button>
    <button data-tp="CARROSSEL">Carrosséis</button>
    <button data-tp="STORY">Stories</button>
  </div>
</header>
<section id="painel" class="so-agenda"></section>
<section id="dash" hidden></section>
<section id="tarefas" class="so-agenda"></section>
<main id="lista" class="so-agenda">Carregando…</main>
<div id="ver" role="dialog" aria-label="Ver post"><div class="topo"><span id="ver-tit"></span><button id="ver-fechar" aria-label="Fechar">×</button></div><div class="fita" id="ver-fita"></div><div class="dica" id="ver-dica"></div></div>
<footer class="so-agenda">Selos: <b>Publicado</b> (já saiu pelo publicador) · <b>Agendado</b> (vai sair no horário) · <b>Metricool</b> (agendado lá, antes da troca para a API; vira Publicado quando o publicador confere no Instagram) · <b>Erro</b> (o Claude precisa ver).</footer>
<script>
const TIPOS = { CARROSSEL:'Carrossel', REEL:'Reel', STORY:'Story' };
const CANAIS = [
  { id:'biblia', nome:'Recortes da Bíblia', handle:'@recortesdabiblia.oficial', base:'/recortes-publicador/' },
  { id:'contos', nome:'Contos Recortados', handle:'@contosrecortados', base:'/contos-publicador/' },
];
let itens = [], quandoF = 'prox', tipoF = 'todos', diasHist = 7, manuais = [], verFeitas = false, met = {}, coms = [];
const fmtN = n => n == null ? '–' : n >= 10000 ? (n/1000).toFixed(1).replace('.', ',') + ' mil' : n.toLocaleString('pt-BR');
function linhaMet(m, tipo){
  if (!m) return '';
  const p = ['👁 ' + fmtN(m.reach) + ' alcance'];
  if (m.views != null) p.push('▶ ' + fmtN(m.views));
  if (m.likes != null) p.push('❤ ' + fmtN(m.likes));
  if (m.comments != null) p.push('💬 ' + fmtN(m.comments));
  if (m.replies != null) p.push('💬 ' + fmtN(m.replies) + ' respostas');
  if (m.saved != null) p.push('🔖 ' + fmtN(m.saved));
  if (m.shares != null) p.push('↗ ' + fmtN(m.shares));
  if (m.ig_reels_avg_watch_time != null) p.push('⏱ ' + (m.ig_reels_avg_watch_time/1000).toFixed(1).replace('.', ',') + ' s assistidos');
  return `<div class="met">${p.join(' · ')}</div>`;
}
function desenharPainel(){
  const seg = met._seguidores || [], el = document.getElementById('painel');
  const pub = itens.filter(i => met[i.id]);
  if (!seg.length && !pub.length) { el.innerHTML = ''; return; }
  const agora = Date.now(), sete = pub.filter(i => agora - new Date(i.quando) < 7*864e5);
  const soma = (l, k) => l.reduce((s, i) => s + (met[i.id][k] || 0), 0);
  const atual = seg.length ? seg[seg.length-1].n : null, antes = seg.find(s => agora - new Date(s.dia) <= 7*864e5) || seg[0];
  const ganho = atual != null && antes ? atual - antes.n : null;
  const melhor = sete.filter(i => i.tipo !== 'STORY').sort((a, b) => (met[b.id].reach||0) - (met[a.id].reach||0))[0];
  el.innerHTML = `<div class="caixa"><h2><span>📊 Desempenho (últimos 7 dias)</span></h2><div class="nums">
    <div class="num"><b>${fmtN(atual)}</b><span>seguidores${ganho ? ` (${ganho > 0 ? '+' : ''}${ganho})` : ''}</span></div>
    <div class="num"><b>${fmtN(soma(sete, 'reach'))}</b><span>alcance somado</span></div>
    <div class="num"><b>${fmtN(soma(sete, 'total_interactions'))}</b><span>interações</span></div>
    <div class="num"><b>${fmtN(soma(sete, 'saved'))}</b><span>salvamentos</span></div>
    <div class="num"><b>${fmtN(soma(sete, 'shares'))}</b><span>compartilhamentos</span></div></div>` +
    (melhor ? `<div class="top">🏆 Melhor da semana: <b>${esc(melhor.titulo||'')}</b> (${TIPOS[melhor.tipo]}) · ${fmtN(met[melhor.id].reach)} de alcance</div>` : '') +
    `<div class="met">Atualiza a cada hora, direto do Instagram${met._em ? ' · última leitura ' + new Date(met._em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}) : ''}.</div></div>`;
}
// Marcações do checklist guardadas no Google Drive do Felipe (Apps Script com PIN), valendo em todos os aparelhos
const SYNC = 'https://script.google.com/macros/s/AKfycbxTXxGNF0bukRQLNLev36OsqaTPhXV-j3BXke2K0MR-Tag2CRApPPErNeW1wFSoXDxfPA/exec';
let remoto = null, pedirPin = false, msgPin = '';
const pinLocal = () => { try { return localStorage.getItem('checklist-pin') || ''; } catch(e) { return ''; } };
async function lerRemoto(){ try { const r = await fetch(SYNC + '?t=' + Date.now()).then(r => r.json()); if (r.ok) remoto = r.feitos || {}; } catch(e) {} }
async function gravarRemoto(dados){
  const r = await fetch(SYNC, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(dados) }).then(r => r.json());
  if (r.ok && r.feitos) remoto = r.feitos;
  return r;
}
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v ? localStorage.setItem(k,'1') : localStorage.removeItem(k); } catch(e){} } };
let canal = CANAIS.find(c => '#'+c.id === location.hash) || CANAIS.find(c => location.pathname.startsWith(c.base)) || CANAIS[0];
function fmtDia(d){ return d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit', timeZone:'America/Sao_Paulo'}); }
function fmtHora(d){ return d.toLocaleTimeString('pt-BR',{hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo'}); }
function chaveDia(d){ return d.toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}); }
function status(i, est, agora){
  const e = est[i.id] || {};
  if (e.status === 'publicado') return ['Publicado','ok'];
  if (i.via === 'metricool') return new Date(i.quando) < agora - 3*3600e3 ? ['Não confirmado','err'] : ['Metricool','mc'];
  if (e.ultimo_erro) return ['Erro','err'];
  if (new Date(i.quando) < agora - 12*3600e3) return ['Não publicado','err'];
  return ['Agendado','ag'];
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// Agenda: período (Próximos / Hoje / Já saíram) × tipo. Abre em Próximos; histórico do mais novo para o mais antigo.
const NOMES = { REEL:['Reel','Reels'], CARROSSEL:['carrossel','carrosséis'], STORY:['Story','Stories'] };
function resumoDia(l){ return ['REEL','CARROSSEL','STORY'].map(t => { const n = l.filter(i => i.tipo === t).length; return n ? n + ' ' + NOMES[t][n > 1 ? 1 : 0] : ''; }).filter(Boolean).join(' · '); }
function emQuanto(ms){
  const m = Math.round(ms / 6e4); if (m < 1) return 'agora';
  if (m < 60) return `em ${m} min`;
  const h = Math.floor(m / 60), r = m % 60; if (h < 24) return `em ${h} h${r ? ' ' + r + ' min' : ''}`;
  const d = Math.round(h / 24); return `em ${d} dia${d > 1 ? 's' : ''}`;
}
function cartao(i){

function interpolar(pts, h){ // pts ordenados por h, começando em (0,0)
  if (!pts.length || h > pts[pts.length-1].x + 1e-9) return null;
  for (let k = 1; k < pts.length; k++) if (h <= pts[k].x) { const a = pts[k-1], b = pts[k]; return b.x === a.x ? b.y : a.y + (b.y - a.y) * (h - a.x) / (b.x - a.x); }
  return pts[pts.length-1].y;
}
function pontosCurva(c, k){
  const p = (c.pontos || []).filter(q => num(q.h) && num(q[k])).sort((a, b) => a.h - b.h).map(q => ({ x: q.h, y: q[k] }));

}
function horaMetade(pts){
  const fim = pts[pts.length-1]; if (pts.length < 2 || !fim.y) return null;

  for (let k = 1; k < pts.length; k++) if (pts[k].y >= alvo) { const a = pts[k-1], b = pts[k]; return b.y === a.y ? b.x : a.x + (b.x - a.x) * (alvo - a.y) / (b.y - a.y); }
  return null;
}

// ----- Público (o Instagram só libera com 100+ seguidores; o robô já pede no fechamento) -----
function secPublico(hist, segAtual){
  const dias = Object.keys(hist).sort().reverse(), d = dias.find(x => hist[x].demografia && Object.values(hist[x].demografia).some(o => o && Object.keys(o).length));
  const expl = 'Idade, gênero e cidade de quem segue e de quem interage (mês atual), e quantos seguidores ficam online em cada hora.';
  if (!d) return caixa('🧑‍🤝‍🧑 Público', expl, `<div class="nada">O Instagram só libera esses dados para contas com 100 seguidores ou mais (hoje: ${f1(segAtual)}). O robô já está pronto: tudo aparece aqui no fechamento do dia (23h30) em que a conta passar de 100.</div>`);
  const dm = hist[d].demografia, gen = { F: 'Mulheres', M: 'Homens', U: 'Não informado' };
  const bloco = (tit, o, nomes) => { if (!o || !Object.keys(o).length) return ''; const tot = soma(Object.values(o));
    const ls = Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 10);
    return `<h3>${tit}</h3>` + tabela(['', 'Pessoas', '%'], ls.map(([k, v]) => [esc((nomes && nomes[k]) || k), C(v), C(v / tot * 100, fp(v / tot * 100, 0))]), null); };
  let h = '';
  [['follower_demographics', 'Quem segue'], ['engaged_audience_demographics', 'Quem interage']].forEach(([m, t]) => {
    h += bloco(`${t}: idade`, dm[m + ':age']) + bloco(`${t}: gênero`, dm[m + ':gender'], gen) + bloco(`${t}: cidades`, dm[m + ':city']); });
  const on = hist[d].online;
  return caixa('🧑‍🤝‍🧑 Público', expl + ` Leitura de ${dd(d)}.`, h + (on && Object.keys(on).length ? '<h3>Seguidores online por hora</h3>' + grafico('g-online') + '<div class="suave">Hora como o Instagram informa (pode estar no fuso dos EUA; o Claude confere quando os dados chegarem).</div>' : ''));
}
// ----- De onde vêm as visualizações (quebra surface_type da conta, se o Instagram aceitar) -----
function secOrigem(hist, cur){
  const q = k => { const o = {}; cur.forEach(d => { const x = hist[d] && hist[d].quebras && hist[d].quebras[k]; if (x) Object.entries(x).forEach(([a, v]) => { if (num(v)) o[a] = (o[a] || 0) + v; }); }); return o; };

  if (!Object.keys(v).length && !Object.keys(r).length) return '';

    tabela(['Origem', 'Views', '% das views', 'Alcance'], ks.map(k => [esc(nome[k] || k), C(v[k]), C(tv ? (v[k] || 0) / tv * 100 : null, tv ? fp((v[k] || 0) / tv * 100, 0) : '—'), C(r[k])]), [0, 'max', 'max', 'max']));

const ATUALIZAR = 'https://script.google.com/macros/s/AKfycbzMcIBcoHw6RaaWn_KZdtrfaKahKhWfxblwJcWwseMKxfs7U58tgbQflbLeBS9BehOxdw/exec';

// Se a página for recarregada, continua sozinha (o pedido fica guardado por 15 min no aparelho).
async function acompanharAtualizacao(){

  const msg = document.getElementById('atuMsg'), btn = document.getElementById('btnAtu');

  const repo = canal.base.replace(/\//g, ''), t0 = ped.t - 15000, api = `https://api.github.com/repos/recortesdabibliaoficial-cmyk/${repo}/actions/runs?per_page=10`;
  msg.innerHTML = '<span class="barra"><span id="atuBar"></span></span> <span id="atuEt"></span>';
  const etapa = (p, t) => { const b = document.getElementById('atuBar'), e = document.getElementById('atuEt'); if (b) b.style.width = p + '%'; if (e) e.textContent = ' ' + t; };
  etapa(10, '1/6 pedido aceito');
  let fimRobo = null;
  for (let k = 0; k < 60 && Date.now() - ped.t < 15 * 60000; k++) {
    try {
      const m = await fetch(canal.base + 'metricas.json?t=' + Date.now()).then(x => x.json());
      if ((m._em || '') !== ped.antes) { etapa(100, '6/6 pronto! O site já tem os números novos.'); msg.insertAdjacentHTML('beforeend', ' <a href="#" onclick="location.reload();return false">Toque para ver</a>');

    } catch(_) {}
    try {
      const runs = ((await fetch(api).then(x => x.json())).workflow_runs || []).filter(w => new Date(w.created_at) >= t0);
      const robo = runs.filter(w => w.name === 'Publicar no Instagram' && w.event === 'workflow_dispatch').pop();   // o mais antigo depois do pedido
      const site = fimRobo ? runs.find(w => /pages/i.test(w.name) && new Date(w.created_at) >= fimRobo - 60000) : null;
      if (site) etapa(site.status === 'completed' ? 95 : 85, site.status === 'completed' ? '5/6 site publicado; carregando…' : '5/6 site publicando os números (1 a 3 min)…');
      else if (robo && robo.status === 'completed') { fimRobo = fimRobo || new Date(robo.updated_at).getTime(); etapa(70, '4/6 números gravados; o site vai publicar em seguida…'); }
      else if (robo && robo.status === 'in_progress') etapa(50, '3/6 robô lendo o Instagram…');
      else if (robo) etapa(25, '2/6 robô na fila…');

}
